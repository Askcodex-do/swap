name: build-windows-exe

# Builds the real Windows PE faceswap.exe on a Windows runner.
#
# PyInstaller cannot cross-compile, so the Windows executable must be produced
# on Windows. This workflow does that on GitHub's windows-latest image, using
# the exact pinned versions from WINDOWS.md (Python 3.10.11, PyInstaller
# 5.13.2), proves the result is a genuine PE binary, smoke-tests it, and
# attaches it to the release under a clearly Windows-labelled filename.
#
# It only ever ADDS an asset. The Linux asset is never touched or replaced.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Windows build to"
        required: true
        default: "v1.0.0"
      attach_to_release:
        description: "Upload the built zip to the release (untick to only build and verify)"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # These two make the build reproducible; without them two builds of the
      # same commit produce different bytes.
      #
      # PYTHONHASHSEED: Python 3.10's marshal writes set/frozenset contents in
      # raw hash order, so any set literal in the source - ours or the standard
      # library's - compiles to different bytes each run. In this project that
      # hit 12 modules (cli.py plus stdlib modules like typing, tarfile, pydoc).
      # CPython only sorts set elements at marshal time from 3.13, so on 3.10
      # the seed has to be pinned.
      #
      # SOURCE_DATE_EPOCH: PyInstaller stamps the PE header with the current
      # time unless this is set, and then rewrites the file, which also changes
      # the PE checksum.
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "315532800"

    outputs:
      asset: ${{ steps.package.outputs.asset }}
      size: ${{ steps.package.outputs.size }}
      sha: ${{ steps.package.outputs.sha }}
      exe_size: ${{ steps.package.outputs.exe_size }}
      exe_sha: ${{ steps.package.outputs.exe_sha }}

    steps:
      - name: Work out the versioned asset name from the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET=faceswap-${version}-windows-x86_64.zip" >> "$GITHUB_ENV"
          echo "INNER_DIR=faceswap-${version}-windows-x86_64" >> "$GITHUB_ENV"
          echo "tag=$RELEASE_TAG version=$version"

      - name: Check out the exact commit being built
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python 3.10.11 (last 3.10 with a Windows installer)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Report the toolchain actually in use
        run: |
          python --version
          python -c "import sys, platform; print('platform:', sys.platform, platform.machine()); print('bits:', 64 if sys.maxsize > 2**32 else 32)"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -c "import cv2, numpy, PyInstaller; print('opencv', cv2.__version__); print('numpy', numpy.__version__); print('pyinstaller', PyInstaller.__version__)"

      - name: Run the test suite before building
        run: python -m pytest tests/ -q

      - name: Print the deformation evidence for this build
        run: python tools/deform_report.py

      - name: Build the exe
        run: python make_exe.py

      - name: Assert the output is a genuine Windows PE binary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import struct, sys, pathlib

          path = pathlib.Path("dist/faceswap.exe")
          problems = []

          if not path.is_file():
              problems.append(f"{path} does not exist")
          else:
              data = path.read_bytes()

              if data[:2] != b"MZ":
                  problems.append(f"not a PE binary: expected magic b'MZ', got {data[:2]!r}")

              e_lfanew = struct.unpack_from("<I", data, 0x3C)[0]
              if data[e_lfanew:e_lfanew + 4] != b"PE\x00\x00":
                  problems.append(
                      f"missing PE signature at 0x{e_lfanew:x}: got {data[e_lfanew:e_lfanew+4]!r}"
                  )
              else:
                  machine = struct.unpack_from("<H", data, e_lfanew + 4)[0]
                  # Subsystem sits at offset 68 of the optional header, PE32 and PE32+ alike.
                  subsystem = struct.unpack_from("<H", data, e_lfanew + 4 + 20 + 68)[0]

                  names = {0x014C: "i386", 0x8664: "x86-64", 0xAA64: "arm64"}
                  print(f"magic          : {data[:2]!r}")
                  print(f"PE signature   : {data[e_lfanew:e_lfanew+4]!r}")
                  print(f"machine        : 0x{machine:04x} ({names.get(machine, 'unknown')})")
                  print(f"subsystem      : {subsystem} "
                        f"({'console' if subsystem == 3 else 'NOT a console app'})")
                  print(f"size           : {len(data):,} bytes")

                  if machine not in names:
                      problems.append(f"unexpected machine type 0x{machine:04x}")
                  if subsystem != 3:
                      problems.append(
                          f"expected a console subsystem (3), got {subsystem}"
                      )

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)

          print("OK: dist/faceswap.exe is a real Windows PE console executable")
          PY

      - name: Prove the build is reproducible
        shell: bash
        run: |
          set -euo pipefail
          # Build a second time from the same source and require the same bytes.
          # This is the check that would have caught the earlier problem, where a
          # rerun produced a different exe and a different zip.
          cp dist/faceswap.exe /tmp/first.exe
          first=$(sha256sum dist/faceswap.exe | cut -d' ' -f1)

          python make_exe.py

          second=$(sha256sum dist/faceswap.exe | cut -d' ' -f1)
          echo "first  build: $first"
          echo "second build: $second"

          if [ "$first" != "$second" ]; then
            echo "::error::two builds of the same commit produced different exe bytes, so the build is not reproducible"
            echo "::error::$(wc -c < /tmp/first.exe) bytes vs $(wc -c < dist/faceswap.exe) bytes"
            exit 1
          fi

          echo "OK: rebuilding this commit reproduces the same exe byte for byte"

      - name: Smoke-test the exe end to end
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import cv2, sys
          sys.path.insert(0, ".")
          from tests.test_pipeline import make_video
          make_video("smoke_clip.mp4", cv2.imread("tests/data/lena_opencv_sample.jpg"))
          print("smoke clip written")
          PY

          echo "--- version ---"
          ./dist/faceswap.exe --version

          echo "--- real swap through the exe ---"
          ./dist/faceswap.exe -s tests/data/obama.jpg -t smoke_clip.mp4 -o smoke_out.mp4

          python - <<'PY'
          import cv2, sys

          cap = cv2.VideoCapture("smoke_out.mp4")
          frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          w = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
          h = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          cap.release()

          raw = open("smoke_out.mp4", "rb").read()
          has_audio = any(tag in raw for tag in (b"mp4a", b"soun", b".mp3", b"ac-3"))

          print(f"output: {frames} frames, {w}x{h}")
          print(f"audio track present: {has_audio}")

          if frames != 24:
              print(f"::error::expected 24 frames, got {frames}")
              sys.exit(1)
          if has_audio:
              print("::error::output unexpectedly contains an audio track")
              sys.exit(1)

          print("OK: the exe swapped every frame and wrote no audio")
          PY

      - name: Package the Windows artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, zipfile

          name = os.environ["RELEASE_ASSET"]
          inner = os.environ["INNER_DIR"]

          files = [
              ("dist/faceswap.exe", f"{inner}/faceswap.exe"),
              ("README.md", f"{inner}/README.md"),
              ("WINDOWS.md", f"{inner}/WINDOWS.md"),
          ]

          # Fixed date on every member instead of the file's mtime, plus a fixed
          # create_system and permission bits, so the zip bytes don't move just
          # because it was packed at a different moment. The date is an arbitrary
          # constant; only its stability matters, and 1980-01-01 is the earliest
          # a zip can express.
          STAMP = (1980, 1, 1, 0, 0, 0)

          with zipfile.ZipFile(name, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for src, arc in files:
                  info = zipfile.ZipInfo(arc, date_time=STAMP)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 0  # MS-DOS, regardless of where it is built
                  info.external_attr = 0o100644 << 16  # plain file, not executable
                  with open(src, "rb") as fh, z.open(info, "w") as dst:
                      while True:
                          chunk = fh.read(1 << 20)
                          if not chunk:
                              break
                          dst.write(chunk)

          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          size = os.path.getsize(name)
          zip_sha = digest(name)
          exe_size = os.path.getsize("dist/faceswap.exe")
          exe_sha = digest("dist/faceswap.exe")

          print(f"packaged {name}")
          print(f"  bytes             : {size:,}")
          print(f"  MiB               : {size / 1048576:.2f}")
          print(f"  zip sha256        : {zip_sha}")
          print(f"  inner faceswap.exe: {exe_size:,} bytes")
          print(f"  exe sha256        : {exe_sha}")

          # Both units are recorded because a size quoted in MB rather than MiB
          # differs by ~4.9%, which is enough for a 58.8 MB zip to be described
          # as a "56.1 MB package" and look like a different file.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"ZIP_SIZE={size}\n")
              fh.write(f"ZIP_SHA256={zip_sha}\n")
              fh.write(f"EXE_SIZE={exe_size}\n")
              fh.write(f"EXE_SHA256={exe_sha}\n")

          # GITHUB_ENV only affects later steps, so the outputs the verify job
          # needs are written here directly rather than echoed by the shell.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"asset={name}\n")
              fh.write(f"size={size}\n")
              fh.write(f"sha={zip_sha}\n")
              fh.write(f"exe_size={exe_size}\n")
              fh.write(f"exe_sha={exe_sha}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Windows build\n\n")
              fh.write(f"- asset: `{name}`\n")
              fh.write(f"- size: {size:,} bytes ({size / 1048576:.2f} MiB)\n")
              fh.write(f"- zip sha256: `{zip_sha}`\n")
              fh.write(f"- inner `faceswap.exe`: {exe_size:,} bytes\n")
              fh.write(f"- exe sha256: `{exe_sha}`\n")
              fh.write("- `dist/faceswap.exe` verified as PE/MZ console x86-64\n")
          PY

      - name: Verify the package is the one just built, and no stale zip is present
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, sys, zipfile

          name = os.environ["RELEASE_ASSET"]
          inner = os.environ["INNER_DIR"]
          problems = []

          # A zip left over from an earlier run in the workspace is exactly how
          # the wrong package ends up attached to a release, so refuse to go on
          # if anything other than this tag's package is lying around.
          others = [p for p in sorted(glob.glob("faceswap-*-windows-x86_64.zip"))
                    if p != name]
          if not os.path.isfile(name):
              problems.append(f"{name} was not produced")
          if others:
              problems.append(
                  f"unexpected extra package(s) present: {others} - refusing to "
                  "upload, so a stale build cannot be picked up"
              )

          if not problems:
              with zipfile.ZipFile(name) as z:
                  got = sorted(z.namelist())
              want = sorted(
                  f"{inner}/{n}" for n in ("faceswap.exe", "README.md", "WINDOWS.md")
              )
              if got != want:
                  problems.append(f"zip holds {got}, expected {want}")
              if os.path.getsize(name) != int(os.environ["ZIP_SIZE"]):
                  problems.append("zip size changed since it was packaged")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)

          size = int(os.environ["ZIP_SIZE"])
          print(f"OK: {name} is the only package and holds exactly the expected files")
          print(f"    {size:,} bytes / {size / 1048576:.2f} MiB")
          print(f"    sha256 {os.environ['ZIP_SHA256']}")
          PY

      # Uploads exactly the file the packaging step produced, by name. A glob
      # like faceswap-*-windows-x86_64.zip would also sweep up a stale package
      # from an earlier version if one were present; pinning the name means the
      # artifact can only ever be this build.
      #
      # compression-level 0 stores it as-is: the zip is already deflated at
      # level 9, so recompressing gains ~2 KB and only risks changing the bytes.
      # The Actions artifact therefore stays byte-identical to the release asset,
      # and its sha256 equals ZIP_SHA256.
      - name: Keep the zip as a workflow artifact too
        uses: actions/upload-artifact@v4
        env:
          RELEASE_ASSET: ${{ env.RELEASE_ASSET }}
        with:
          name: faceswap-windows-x86_64
          path: ${{ env.RELEASE_ASSET }}
          if-no-files-found: error
          compression-level: 0

      - name: Attach to the release without disturbing existing assets
        if: github.event_name != 'workflow_dispatch' || inputs.attach_to_release
        shell: bash
        run: |
          set -euo pipefail

          echo "target release: $RELEASE_TAG"
          # Create the release if this tag does not have one yet, so a fresh
          # version works without a manual step.  Creating is a no-op if it
          # already exists.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG does not exist yet; creating it"
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "faceswap $RELEASE_VERSION" --generate-notes
          fi

          echo "--- assets before ---"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | tee /tmp/before.txt

          # Only ever adds/replaces this one Windows asset. --clobber lets a
          # re-run replace its own artifact; it cannot touch the Linux asset
          # because the filename differs.
          gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" \
            --repo "$GITHUB_REPOSITORY" --clobber

          echo "--- assets after ---"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'

          # The Linux asset must still be there if it was there before.
          if grep -q 'linux' /tmp/before.txt; then
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' | grep -q 'linux'; then
              echo "::error::the Linux asset disappeared from the release"
              exit 1
            fi
            echo "OK: Linux asset still present alongside the Windows one"
          fi

          count=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          if [ "$count" -lt 1 ]; then
            echo "::error::no release assets after upload"
            exit 1
          fi
          echo "OK: release now carries $count assets"

  # Runs after the build job. Downloads the artifact back from Actions and
  # checks it byte-for-byte against what the build produced, and that the exe
  # inside it is the freshly built dist/faceswap.exe. Doing this in a separate
  # job is deliberate: an in-job download can race the artifact upload and read
  # back a partial archive.
  verify-artifact:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download the artifact exactly as a user would
        uses: actions/download-artifact@v4
        with:
          name: faceswap-windows-x86_64
          path: artifact-check

      - name: Check the artifact is the exact package built, and read the exe hash
        shell: bash
        env:
          ASSET: ${{ needs.build-windows.outputs.asset }}
          SIZE: ${{ needs.build-windows.outputs.size }}
          SHA: ${{ needs.build-windows.outputs.sha }}
          EXE_SIZE: ${{ needs.build-windows.outputs.exe_size }}
          EXE_SHA: ${{ needs.build-windows.outputs.exe_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, sys, zipfile

          name = os.environ["ASSET"]
          want_size = int(os.environ["SIZE"])
          want_sha = os.environ["SHA"]
          want_exe_size = int(os.environ["EXE_SIZE"])
          want_exe_sha = os.environ["EXE_SHA"]

          root = "artifact-check"
          found = []
          for dirpath, _dirs, filenames in os.walk(root):
              for fn in filenames:
                  found.append(os.path.join(dirpath, fn))

          print("files in the downloaded artifact:")
          for p in sorted(found):
              print(f"  {os.path.relpath(p, root)}  {os.path.getsize(p):,} bytes")

          problems = []
          if len(found) != 1:
              print(f"::error::artifact holds {len(found)} files, expected exactly 1")
              sys.exit(1)

          path = found[0]
          got_name = os.path.relpath(path, root)
          if got_name != name:
              problems.append(f"artifact file is {got_name}, expected {name}")

          size = os.path.getsize(path)
          if size != want_size:
              problems.append(
                  f"artifact is {size:,} bytes but the build produced {want_size:,}"
              )

          h = hashlib.sha256()
          with open(path, "rb") as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b""):
                  h.update(chunk)
          digest = h.hexdigest()
          if digest != want_sha:
              problems.append(
                  f"artifact sha256 {digest} does not match built zip {want_sha}"
              )

          # The exe that ships must be the one this run built, at the expected
          # size and hash, and it must unpack to a real Windows PE image.
          exe_sha_actual = None
          exe_size_actual = None
          with zipfile.ZipFile(path) as z:
              exes = [n for n in z.namelist() if n.endswith("faceswap.exe")]
              if len(exes) != 1:
                  problems.append(f"expected one faceswap.exe, found {exes}")
              else:
                  eh = hashlib.sha256()
                  exe_size_actual = 0
                  head = b""
                  with z.open(exes[0]) as fh:
                      while True:
                          chunk = fh.read(1 << 20)
                          if not chunk:
                              break
                          if len(head) < 2:
                              head += chunk[:2]
                          eh.update(chunk)
                          exe_size_actual += len(chunk)
                  exe_sha_actual = eh.hexdigest()
                  if head[:2] != b"MZ":
                      problems.append(f"inner exe does not start with MZ: {head[:2]!r}")
                  if exe_size_actual != want_exe_size:
                      problems.append(
                          f"inner exe is {exe_size_actual:,} bytes, build made "
                          f"{want_exe_size:,}"
                      )
                  if exe_sha_actual != want_exe_sha:
                      problems.append(
                          f"inner exe sha256 {exe_sha_actual} does not match built "
                          f"{want_exe_sha}"
                      )

          print()
          print(f"artifact  : {got_name}")
          print(f"  size    : {size:,} bytes ({size / 1048576:.2f} MiB)")
          print(f"  sha256  : {digest}")
          print(f"inner exe : {exe_size_actual:,} bytes  MZ image")
          print(f"  sha256  : {exe_sha_actual}")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Uploaded artifact verified\n\n")
              fh.write(f"- file: `{got_name}`\n")
              fh.write(f"- size: {size:,} bytes ({size / 1048576:.2f} MiB)\n")
              fh.write(f"- zip sha256: `{digest}`\n")
              fh.write(f"- inner `faceswap.exe`: {exe_size_actual:,} bytes\n")
              fh.write(f"- exe sha256: `{exe_sha_actual}`\n")
              fh.write("- artifact bytes == build bytes, exe is the freshly built dist image\n")

          print()
          print("OK: the downloadable artifact is byte-for-byte the freshly built package")
          PY

